name: rideshare-pipeline

on:
  schedule:
    - cron: "17 13 * * 1"        # Mondays 13:17 UTC (early morning in Chicago)
  workflow_dispatch:
    inputs:
      start:
        description: "Backfill start date (YYYY-MM-DD). Leave blank for the last 45 days."
        required: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore cached data
        uses: actions/cache/restore@v4
        with:
          path: data/raw/hourly_od
          key: hourly-od-${{ github.run_id }}
          restore-keys: hourly-od-

      - name: Extract
        env:
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
        run: |
          START="${{ github.event.inputs.start }}"
          if [ -z "$START" ]; then START=$(date -u -d '45 days ago' +%F); fi
          python src/extract.py agg --start "$START"

      - name: Save data to cache
        uses: actions/cache/save@v4
        with:
          path: data/raw/hourly_od
          key: hourly-od-${{ github.run_id }}

      - name: Build and test models
        working-directory: dbt_rideshare
        run: |
          mkdir -p ../warehouse
          dbt seed  --profiles-dir .
          dbt build --profiles-dir . --exclude stg_trips+

      - name: Export dashboard CSVs
        run: python src/export.py analysis/export.sql

      - name: Commit refreshed CSVs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dashboard/*.csv
          git commit -m "Data refresh $(date -u +%F)" || echo "No changes to commit"
          git push
